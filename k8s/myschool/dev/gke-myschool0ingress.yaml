apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myschool-ingress-v3
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  ingressClassName: gce
  rules:
  - http:
      paths:
      - path: /pupil
        pathType: Prefix
        backend:
          service:
            name: myschool-service-v3
            port:
              number: 80
      - path: /pupil_add_student
        pathType: Prefix
        backend:
          service:
            name: myschool-service-v3
            port:
              number: 80
      - path: /pupil_delete_student
        pathType: Prefix
        backend:
          service:
            name: myschool-service-v3
            port:
              number: 80
      - path: /static
        pathType: Prefix
        backend:
          service:
            name: myschool-service-v3
            port:
              number: 80