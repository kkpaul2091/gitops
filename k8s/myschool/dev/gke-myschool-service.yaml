apiVersion: v1
kind: Service
metadata:
  name: myschool-service-v3
  namespace: dev
  labels:
    app: myschool-v3
  annotations:
    cloud.google.com/backend-config: '{"default":"myschool-backendconfig"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: myschool-v3
  ports:
    - port: 80
      targetPort: 8002
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: myschool-backendconfig
  namespace: dev
spec:
  healthCheck:
    checkIntervalSec: 30
    timeoutSec: 10
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /pupil
    port: 8002