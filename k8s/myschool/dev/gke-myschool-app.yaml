kubectl apply  -f - <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
    name: myschool-deployment-v3
    namespace: dev
spec:    
    replicas: 1
    selector:
      matchLabels:
        app: myschool-v3
    template:
      metadata:
        labels:
          app: myschool-v3
      spec:       
        containers:
        - name: myschool-v3
          image: kanu17/my-school-pupil:2.0.0
          envFrom:
           - secretRef:
               name: app-mongodb-credentials
          imagePullPolicy: Always 
          ports:
          - containerPort: 8002
---


apiVersion: v1
kind: Service
metadata:
  name: myschool-service-v3
  namespace: dev
  labels:
    app: myschool-v3
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: myschool-v3
  ports:
    - port: 80
      targetPort: 8002

